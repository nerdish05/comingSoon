name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run pytest
        run: pytest -q

      - name: Build image and smoke-test the container
        run: |
          docker build -t coming-soon-site:ci .
          docker run -d --name coming-soon-ci -p 8000:8000 coming-soon-site:ci
          cleanup() {
            docker logs coming-soon-ci || true
            docker stop coming-soon-ci || true
            docker rm coming-soon-ci || true
          }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 30); do
            if code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/); then
              if [ "$code" = "200" ]; then
                echo "Smoke test passed: GET / returned 200"
                ok=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "Smoke test failed: GET http://127.0.0.1:8000/ did not return 200"
            exit 1
          fi
          trap - EXIT
          docker stop coming-soon-ci
          docker rm coming-soon-ci

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-coming-soon
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR="${{ secrets.APP_DIR }}"
            APP_DIR="${APP_DIR:-/opt/coming-soon-site}"
            APP_DIR=${APP_DIR} bash ${APP_DIR}/scripts/deploy.sh
