version: "3.9"

services:
  web:
    image: ${IMAGE_NAME:-coming-soon-site}:${IMAGE_TAG:-latest}
    build: .
    container_name: coming-soon-web
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: coming-soon-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      # Uncomment once you've provisioned a TLS cert (see README-deployment.md)
      # - "443:443"
    volumes:
      - ./nginx/coming-soon.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
