name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sanity-check the app imports cleanly
        run: python -c "import main; assert main.app"

      - name: Build Docker image (build-only sanity check)
        run: docker build -t coming-soon-site:ci .

  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export APP_DIR="${{ secrets.APP_DIR }}"
            bash "$APP_DIR/scripts/deploy.sh"
