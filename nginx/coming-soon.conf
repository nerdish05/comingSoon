# Reverse proxy for the FastAPI app.
# Replace `your-domain.com` once you've pointed DNS at the EC2 instance.
# See README-deployment.md for the Certbot steps to enable the HTTPS block below.

server {
    listen 80;
    server_name your-domain.com;

    # Uncomment after running certbot, and it will handle ACME challenges here:
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

