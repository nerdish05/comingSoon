<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12141A;
    --ivory: #F4EFE6;
    --amber: #D9A64E;
    --slate: #8A8F9C;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--ivory);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Placeholder logo mark */
  .logo {
    width: 168px;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: flash 2.6s ease-in-out infinite;
  }

  .logo svg {
    width: 100%;
    height: 100%;
  }

  @keyframes flash {
    0%, 100% {
      opacity: 1;
      filter: drop-shadow(0 0 0px rgba(217, 166, 78, 0));
    }
    50% {
      opacity: 0.5;
      filter: drop-shadow(0 0 36px rgba(217, 166, 78, 0.55));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
  }

  .label {
    margin-top: 40px;
    font-family: 'Fraunces', serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--ivory);
  }

  .sublabel {
    margin-top: 10px;
    font-size: 14px;
    color: var(--slate);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="logo">
      <!-- Placeholder logo mark: swap this SVG for your real logo -->
      <svg viewBox="0 0 168 168" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="160" height="160" rx="28" stroke="#F4EFE6" stroke-width="1.5" opacity="0.35"/>
        <path d="M84 32 L120 84 L84 136 L48 84 Z" stroke="#F4EFE6" stroke-width="2" fill="none"/>
        <circle cx="84" cy="84" r="10" fill="#F4EFE6"/>
      </svg>
    </div>

    <p class="label">Coming soon Jai Guruji</p>
    <p class="sublabel">We're putting the finishing touches on something new.</p>
  </div>

</body>
</html>
